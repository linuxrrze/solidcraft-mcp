# Extra `<app>-cli mcp` arguments, one app per line: <app> <args...>
# $WORK_DIR / $HOME are expanded when the server config is rendered (at
# container start). Same format as storytold-mcp's app-args.conf.
#
# --headless: without it solidcraft-cli first looks for a running app.
# --allow-path: solidcraft only touches design folders under $HOME/tmp and
# its own scratch dir by default; add the shared work dir.
solidcraft   --headless --allow-path $WORK_DIR
